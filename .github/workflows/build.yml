name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-net:
    name: Test networking crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path net/Cargo.toml

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build debug APK (installable on a phone)
        # The cargo-apk image ships an old Rust; current crates need a newer one.
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk sh -c '
            set -e
            rustc --version
            rustup toolchain install stable --profile minimal
            rustup default stable
            rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
            rustc --version
            cargo quad-apk build
          '
      - name: Fix file ownership (the container built as root)
        run: sudo chown -R "$USER" target
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeCraft-apk
          path: target/android-artifacts/debug/apk/*.apk
          if-no-files-found: error

  emulator:
    name: Run APK on Android 13 emulator
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ClaudeCraft-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          script: bash ci/emu-test.sh apk/*.apk
