name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-net:
    name: Test networking crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path net/Cargo.toml

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build debug APK (installable on a phone)
        # The cargo-apk image ships an old Rust; current crates need a newer one.
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk sh -c '
            set -e
            rustc --version
            rustup toolchain install stable --profile minimal
            rustup default stable
            rustup target add armv7-linux-androideabi aarch64-linux-android
            rustc --version
            cargo quad-apk build
          '
      - name: Fix file ownership (the container built as root)
        run: sudo chown -R "$USER" target
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeCraft-apk
          path: target/android-artifacts/debug/apk/claudecraft.apk
          if-no-files-found: error
